<div class="form-group mb-3">
  <input
    type="text"
    [class.is-invalid]="ngControl?.touched && ngControl?.invalid"
    class="form-control"
    [value]="value"
    [placeholder]="label"
    [disabled]="disabled"
    (bsValueChange)="onDateChange($event)"
    (blur)="onBlur()"
    bsDatepicker  
    [bsConfig]="bsConfig"
    [maxDate]="maxDate"
  />

  <div *ngIf="ngControl.control.errors?.required" class="invalid-feedback">{{label}} is required</div>
</div>
