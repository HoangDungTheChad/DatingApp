<div class="text-center mt-3">
  <h2>{{predicate === "liked" ? "Members I liked" : "Members who like me"}}</h2>
</div>

<div class="container mt-3">
  <div class="row col-4">
    <div class="btn-group" name="predicate">
      <div class="btn btn-primary" btnRadio="likedByMe" [(ngModel)]="predicate" 
        (click)="loadLikes()">Members I like</div>
      <div class="btn btn-primary" btnRadio="likedMe" [(ngModel)]="predicate" 
        (click)="loadLikes()">Members who liked me</div>
    </div>
  </div>

  <div class="row mt-3">
    <ng-container *ngIf="members.length > 0">
      <div class="col-2" *ngFor="let member of members">
        <app-member-card (removeAction)="handleRemoveAction($event)" [relType]="predicate" [member]="member" type="unlike-card"></app-member-card>
      </div>
    </ng-container>
    
    <ng-container *ngIf="members.length == 0 && predicate == 'likedMe'">
      <div class="text-center mt-3 mb-5">
        <div style="font-size: 60px; opacity: 0.4;">💬</div>

        <div class="mt-3 fw-semibold" style="font-size: 1.75rem; color: #ff9800;">
          No one has liked you yet, bro  💔
        </div>

        <div class="mt-2" style="font-size: 1.1rem; color: #6c757d;">
          Don’t worry, charm takes time 😎
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="members.length === 0 && predicate === 'likedByMe'">
      <div class="text-center mt-3 mb-5">
        <div style="font-size: 64px;">💘</div>
        <div class="mt-3 fw-bold" style="font-size: 2rem; color: #ff6f00;">
          No crushes yet?
        </div>
        <div class="text-muted" style="font-size: 1.1rem;">
          Start liking — your match might be one click away 😏
        </div>
      </div>
  </ng-container>

  </div>
</div>                                                    

<div class="d-flex justify-content-center" *ngIf="pagination">
  <pagination                                               
    [boundaryLinks]="true"
    [totalItems]="pagination.totalItems"
    [itemsPerPage]="pagination.itemsPerPage"
    [(ngModel)]="pagination.currentPage"
    (pageChanged)="pageChanged($event)"
    previousText="&lsaquo;"
    nextText="&rsaquo;"
    firstText="&laquo;"
    lastText="&raquo;"
  >
  </pagination>
</div>
