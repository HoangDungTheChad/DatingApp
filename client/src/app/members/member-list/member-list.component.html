<div class="text-center mt-3">
  <h2>Your Potential Matches</h2>
</div>

<h1>Commit 1</h1>
<h1>Commit 2</h1>
<h1>Commit 4</h1>
<h1>Commit 3</h1>

<div class="container mt-3">
  <form
    id="filter-form"
    #form="ngForm"
    class="d-flex align-items-center flex-wrap gap-2 mb-3"
    (ngSubmit)="loadMembers()"
    autocomplete="off"
  >
    <div class="form-group px-2 d-flex align-items-center gap-1">
      <label>Age from: </label>
      <input
        type="number"
        class="form-control m-lg-1"
        style="width: 70px"
        name="minAge"
        [(ngModel)]="userParams.minAge"
      />
    </div>

    <div class="form-group px-2">
      <label>Age to: </label>
      <input
        type="number"
        class="form-control m-lg-1"
        style="width: 70px"
        name="maxAge"
        [(ngModel)]="userParams.maxAge"
      />
    </div>

    <div class="form-group px-2">
      <label>Show: </label>
      <select
        name="gender"
        style="width: 130px"
        [(ngModel)]="userParams.gender"
        class="form-control m-lg-1"
      >
        <option *ngFor="let gender of genderList" [value]="gender.value">
          {{ gender.display }}
        </option>
      </select>
    </div>

    <button class="btn btn-primary ml-1" type="submit">Apply filters</button>
    <button (click)="resetFilters()" class="btn btn-info ml-1" type="submit">
      Reset filters
    </button>

    <div class="btn-group float-right">
      <button
        type="button"
        name="orderBy"
        class="btn btn-primary"
        (click)="loadMembers()"
        btnRadio="lastActive"
        [(ngModel)]="userParams.orderBy"
      >
        Last Active
      </button>

      <button
        type="button"
        name="orderBy"
        class="btn btn-primary"
        (click)="loadMembers()"
        btnRadio="created"
        [(ngModel)]="userParams.orderBy"
      >
        Newest Members 
      </button>
    </div>
  </form>
</div>

<div class="row">
  <div *ngFor="let member of members" class="col-2">
    <app-member-card [liked]="isLiked(member.username)" [member]="member"></app-member-card> 
  </div>
</div>

<div class="d-flex justify-content-center" *ngIf="pagination">
  <pagination
    [boundaryLinks]="true"
    [totalItems]="pagination.totalItems"
    [itemsPerPage]="pagination.itemsPerPage"
    [(ngModel)]="pagination.currentPage"
    (pageChanged)="pageChanged($event)"
    previousText="&lsaquo;"
    nextText="&rsaquo;"
    firstText="&laquo;"
    lastText="&raquo;"
  >
  </pagination>
</div>
