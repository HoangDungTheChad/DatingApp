<div class="card mb-4">
  <div class="card-img-wrapper"> 
    <img src="{{member.photoUrl || './assets/user.png'}}" alt="{{member.knownAs}}" class="card-img-top">
    <ul class="list-inline member-icons animate text-center">
      <li class="list-inline-item"><button class="btn btn-primary" [routerLink]="['/members', member.username]" >
        <i class="fa fa-user"></i></button></li>

      <li class="list-inline-item">
        <button 
          (click)="isUnlikeCard ? remove(member.username, relType) : addLike(member.username)" class="btn btn-primary">
          <i [ngClass]="isUnlikeCard ? 'fa fa-times' : 'fa fa-heart'"></i>
        </button>
      </li> 

      <li class="list-inline-item">
        <button 
          [routerLink]="['/members', member.username]"
          [queryParams]="{tab: 3}"
          class="btn btn-primary">
        <i class="fa fa-envelope"></i>
      </button></li>
    </ul>
  </div>
  <div class="card-body p-1 position-relative">
    <!-- heart icon and animation -->
    <div class="like-badge" *ngIf="liked">
      <i class="fa fa-heart text-danger"></i>
    </div>

    <h6 class="card-title text-center mb-1">
      <span *ngIf="!(presence.onlineUsers$ | async).includes(member.username)">
        <i class="fa fa-user me-2 text"></i>
      </span>
      <span *ngIf="(presence.onlineUsers$ | async).includes(member.username)">
        <i [class.is-online]="true" class="fa fa-circle text-success me-2"></i>
      </span>
      {{member.knownAs}}, {{member.age}}
    </h6>
    <p class="card-text text-muted text-center">{{member.city}}</p>
  </div>
</div>
