<div class="card">
  <div class="card-body">
    <div *ngIf="(messageService.messageThread$ | async).length === 0">
      No messages yet.. say hi by using the message box below
    </div>

    <ul #scrollMe  
      style="overflow-y: scroll; height: 500px; padding-right: 10px;"
      class="chat">
      <ng-container *ngIf="(messageService.messageThread$ | async).length > 0">
        <li *ngFor="let message of (messageService.messageThread$ | async)"
          [ngClass]="{'my-message': message.senderUsername != username, 'their-message': message.senderUsername == username}">
          <div>
            <span class="chat-img float-end">
              <img class="rounded-circle" [src]="message.senderPhotoUrl || 'assets/user.png'" 
                alt="{{message.senderUsername}}">
            </span>
            <div class="chat-body">
              <div class="header">
                <small class="text-muted">
                  <span class="fa fa-clock-o me-2">&nbsp;&nbsp;{{message.dateSent | date: 'short'}}</span>
                  <span class="text-danger" *ngIf="!message.dateRead 
                    && message.recipientUsername === username">
                    (unread)    
                  </span>
                  <span class="text-success" *ngIf="message.dateRead 
                    && message.recipientUsername === username">
                    (read) {{message.dateRead | date: 'short'}}
                  </span>
                </small>
              </div>
              <p>{{message.content}}</p>
            </div>
          </div>
        </li>
      </ng-container>
    </ul>
  </div>

  <div class="card-footer">
    <form #messageForm="ngForm" action="" (ngSubmit)="sendMessage()" autocomplete="off">
      <div class="input-group">
        <input 
          required
          name="messageContent" 
          [(ngModel)]="messageContent"
          type="text" 
          class="form-control input-sm" 
          placeholder="Send a private message">
        <div class="input-group-append">
          <button [disabled]="!messageForm.valid" class="btn btn-primary" type="submit">Send</button>
        </div>
      </div>
    </form>
  </div>
</div>
