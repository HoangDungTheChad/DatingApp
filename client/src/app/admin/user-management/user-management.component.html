<div class="row" justify-content-center style="padding-top: 20px;">
  <div class="mx-col-12 col-lg-10">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr class="fw-bold">
          <th style="width: 30%">Username</th>
          <th style="width: 40%">Active Roles</th>
          <th style="width: 30%" class="text-end">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.username }}</td>
        <td>
            <span *ngFor="let role of user.roles; let last = last">
              {{ role }}<span *ngIf="!last">, </span>
            </span>
          </td>
          <td class="text-end">    
            <button (click)="openRolesModal(user)" class="btn btn-info">Edit Roles</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
